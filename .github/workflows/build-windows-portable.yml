name: Build Windows Portable App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-windows-portable.yml

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Match locked dependency version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw
          $package = $package.Replace('"eslint-plugin-react-hooks": "7.37.5"', '"eslint-plugin-react-hooks": "7.1.1"')
          Set-Content package.json $package
      - name: Install dependencies
        run: npm ci
      - name: Build renderer
        run: npm run desktop:build
      - name: Build single portable EXE
        run: npx electron-builder --config desktop/electron-builder.json --win portable --x64 --publish never
      - name: Upload portable EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: coral-reef-wallpaper-windows-exe
          path: release-wallpaper/coral-reef-wallpaper-0.1.0-win-x64.exe
          if-no-files-found: error
      - name: Publish public Windows download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.2
          name: Coral Reef Wallpaper for Windows v0.2.2
          body: |
            Windows용 산호초 움직이는 바탕화면 앱입니다.
            EXE 파일 하나를 내려받아 더블클릭하면 됩니다.
          files: release-wallpaper/coral-reef-wallpaper-0.1.0-win-x64.exe
          make_latest: true
