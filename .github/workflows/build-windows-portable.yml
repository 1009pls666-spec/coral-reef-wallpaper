name: Build Windows Portable App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-windows-portable.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build renderer
        run: npm run desktop:build
      - name: Build single portable EXE
        run: npx electron-builder --config desktop/electron-builder.json --win portable --x64 --publish never
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: coral-reef-wallpaper-windows-exe
          path: release-wallpaper/coral-reef-wallpaper-0.1.0-win-x64.exe
          if-no-files-found: error
          compression-level: 0
